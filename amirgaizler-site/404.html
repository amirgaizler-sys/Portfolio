<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="color-scheme" content="dark" />
  <title>404 — Amir Gaizler</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#0a0a0a;--ink:#fff;--muted:rgba(255,255,255,.45);--faint:rgba(255,255,255,.1)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{background:var(--bg)}
    body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .nav{height:56px;display:flex;align-items:center;padding:0 clamp(14px,2.5vw,28px)}
    .logo{font-size:21px;font-weight:500;letter-spacing:-.02em}
    .logo .reg{font-size:10px;font-weight:300;vertical-align:top}
    main{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
    padding:0 clamp(20px,6vw,80px);gap:22px}
    h1{font-size:clamp(90px,20vw,240px);font-weight:300;line-height:1;letter-spacing:-.03em}
    p{font-size:clamp(15px,2vw,19px);font-weight:300;color:var(--muted);max-width:40ch}
    .back{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.09em;
    text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:3px;transition:gap .25s}
    .back:hover{gap:18px}.back::after{content:'\2192'}
    .foot{padding:20px clamp(14px,2.5vw,28px) calc(20px + env(safe-area-inset-bottom));
    border-top:1px solid var(--faint);font-size:11px;color:var(--muted)}
  </style>
</head>
<body>
  <nav class="nav"><a href="index.html" class="logo">AG<span class="reg">&reg;</span></a></nav>
  <main>
    <h1>404</h1>
    <p>This page drifted off the grid. It may have been moved, renamed, or never existed at all.</p>
    <a href="index.html" class="back">Back to work</a>
  </main>
  <footer class="foot">&copy; 2025 Amir Gaizler</footer>
</body>
</html>
